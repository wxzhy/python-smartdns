<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{{ title or "dns-forwarder" }}</title>
  {% block head %}{% endblock %}
  <style>
    body { font-family: "Microsoft YaHei UI", sans-serif; margin: 2rem auto; max-width: 960px; color: #1f2937; }
    h1, h2, h3 { margin-bottom: 0.5rem; }
    a, button { color: #0f766e; }
    textarea { width: 100%; min-height: 26rem; font-family: Consolas, monospace; }
    .panel { border: 1px solid #d1d5db; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; background: #f9fafb; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .pill { display: inline-block; background: #ecfeff; color: #155e75; padding: 0.2rem 0.6rem; border-radius: 999px; margin-right: 0.5rem; }
    .error { color: #b91c1c; white-space: pre-wrap; }
    .ok { color: #166534; }
    .muted { color: #4b5563; }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
