[project]
name = "python-smartdns"
version = "0.1.0"
description = "Async dns-forwarder skeleton built with dnspython and FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohappyeyeballs>=2.6.1",
    "aiodns>=4.0.0",
    "anyio>=4.0.0",
    "async-lru>=2.0.5",
    "dnspython[doh,doq,idna]>=2.8.0",
    "fastapi[all]>=0.135.2",
    "httpx>=0.28.1",
    "icmplib>=3.0.4",
    "marisa-trie>=1.4.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "py-radix>=0.10.0",
    "uvicorn>=0.35.0",
    "winuvloop>=0.2.0",
    "pynacl>=1.6.2",
    "aiohttp[speedups]>=3.13.5",
    "curl-cffi>=0.15.0",
    "niquests[full]>=3.18.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "ty>=0.0.58",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 让测试在未安装包的情况下也能直接 import dns_forwarder，无需 conftest 改 sys.path。
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["tags"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
