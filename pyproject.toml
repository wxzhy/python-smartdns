[project]
name = "python-smartdns"
version = "0.1.0"
description = "Async dns-forwarder skeleton built with dnspython and FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "async-lru>=2.0.5",
    "dnspython[doh,doq,idna]>=2.8.0",
    "fastapi[all]>=0.135.2",
    "icmplib>=3.0.4",
    "marisa-trie>=1.4.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "py-radix>=0.10.0",
    "uvicorn>=0.35.0",
    "winuvloop>=0.2.0; sys_platform == 'win32'",
    "pynacl>=1.6.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["tags"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
