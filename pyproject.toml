[project]
name = "python-smartdns"
version = "0.1.0"
description = "Async dns-forwarder skeleton built with dnspython and FastAPI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohappyeyeballs>=2.6.1",
    "aiodns>=4.0.0",
    "anyio>=4.5",
    "async-lru>=2.0.5",
    "dnspython[doh,idna]>=2.8.0",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "icmplib>=3.0.4",
    "marisa-trie>=1.4.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "py-radix>=0.10.0",
    "uvicorn>=0.35.0",
    "winuvloop>=0.2.0",
    "pynacl>=1.6.2",
    "aiohttp[speedups]>=3.13.5",
    "curl-cffi>=0.15.0",
    "niquests[utls,http3]>=3.18.7",
    "httptools>=0.8.0",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "ty>=0.0.58",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["tags"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "B",
    "UP",
    "SIM",
    "C4",
    "ASYNC",
    "RUF",
    "PT",
    "TID",
    "PTH",
    "PERF",
    "FURB",
    "RET",
    "TC",
    "PL",
    "PIE",
]

# 仅忽略中文全角标点误报：项目注释/docstring 使用中文（，。「」等）为正确写法。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 让测试在未安装包的情况下也能直接 import dns_forwarder，无需 conftest 改 sys.path。
pythonpath = ["."]
testpaths = ["tests"]


